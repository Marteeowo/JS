        const arv = 0;

        // Serveri võimsus: 400 vatti (W)

        // Sinu ülesanne on arvutada serveri töökulu ühe tunni jooksul eurodes.
        // Voolutarbimine (kWh) = Võimsus (W) / 1000
        // Töökulu (eurodes) = Voolutarbimine (kWh) * Elektri hind (eurod/kWh)
