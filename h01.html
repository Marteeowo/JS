<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS harjutused</title>
</head>
<body>
    <script>
        // Harjutus 6
        // Positiivne või negatiivne
        // Kirjuta switch-case programm, mis kontrollib, kas sisestatud number on positiivne,
        // negatiivne või null. Programm peaks väljastama vastava teate vastavalt sisestatud
        // numbri väärtusele.
        const arv = 0;

        switch (true) {
            case arv > 0:
                console.log("Pos");
                break;
            case arv === 0:
                console.log("null");
                break;
            case arv < 0:
                console.log("Negr");
                break;
            default:
                console.log("Jama");
        }

        // Harjutus 5
        // Temperatuur
        // Kirjutage programm, mis kontrollib saadud temperatuuri põhjal olukorda.
        // Kui temperatuur on suurem kui 25 kraadi, väljastage "Väga kuum ilm!".
        // Kui temperatuur on vahemikus 15 kuni 25 kraadi, väljastage "Mõnus temperatuur".
        // Kui temperatuur on väiksem kui 15 kraadi, väljastage "Jahe ilm".
        const temp = 25;

        if (temp > 25) {
            console.log("TULINE!!");
        } else if (temp >= 15 && temp <= 25) {
            console.log("Norm.");
        } else {
            console.log("Kuradi külm on");
        }

        // Harjutus 4
        // Nädalapäevad
        const np = ["Esmaspäev", "Teisipäev", "Kolmapäev", "Neljapäev", "Reede"];
        console.log(`Massiivi suurus: ${np.length}`);
        np.push("Laupäev", "Pühapäev");
        np.reverse();
        console.log(`Viimane element: ${np[np.length - 1]}`);

        // Sportlased
        const sportlased = [
            ["Alice", 25, [10.2, 9.8, 10.5]],
            ["Bob", 22, [9.5, 9.6, 9.7]],
            ["Charlie", 28, [11.1, 11.2, 11.5]],
        ];

        console.log(sportlased[0][0]);
        console.log(Math.max(...sportlased[0][2]));
        console.log(sportlased[1][0]);
        console.log(Math.max(...sportlased[1][2]));
        console.log(sportlased[2][0]);
        console.log(Math.max(...sportlased[2][2]));

        // Harjutus 3
        // Sõidu aeg ja kaugus
        // Õpilane tahab teada, kui kaua võtab aega teatud kauguse läbimine kindla kiirusega.
        // Kasuta muutujaid sõidu kauguse (kilomeetrites) ja kiiruse (kilomeetrites tunnis)
        // hoidmiseks. Arvuta ja kuva konsooli sõidu aeg (tundides).
        const kaugus = 100;
        const kiirus = 90;
        const aeg = kaugus / kiirus;
        console.log(`Sõidu aeg on ${aeg.toFixed(2)} tundi.`);

        // Serveri töökulu
        // Sinu ülesanne on arvutada, kui palju maksab serveri töös hoidmine ühe tunni jooksul,
        // kasutades järgmisi andmeid:
        // Serveri võimsus: 400 vatti (W)
        // Elektri hind: 9.69 senti/kWh
        // Sinu ülesanne on arvutada serveri töökulu ühe tunni jooksul eurodes.
        // Voolutarbimine (kWh) = Võimsus (W) / 1000
        // Töökulu (eurodes) = Voolutarbimine (kWh) * Elektri hind (eurod/kWh)
        const voimsus = 400;
        const hind = 9.69;
        const voolutarbimine = voimsus / 1000;
        const kulu = voolutarbimine * hind;
        console.log(`Serveri töökulu on ${kulu.toFixed(2)} eurot.`);

        // Harjutus 2
        // Kellaaeg
        const t = 2;
        const m = 38;
        const s = 59;
        console.log(`${t}:${m}:${s}PM`);

        // Mallid
        const enimi = "Mari";
        const pnimi = "Maasikas";
        console.log(`${enimi} ${pnimi} nimetähed on ${enimi[0]}.${pnimi[0]}.`);

        // Andmerida analüüs
        const data = "1,Marshal,Martinovic,mmartinovic0@dedecms.com,Male,40.19.226.175";
        console.log(data.split(",")[5]);
        const tykeldused = data.split(",");
        console.log(tykeldused[3].split("@")[0]);

        // Harjutus 1
        console.log("Tere maailm!");
        console.log(typeof 4.2);
        console.log(typeof "Will Code 4 food");
        console.log(typeof "123");
        console.log(typeof true);
        console.log(typeof [1, 2, 3]);
        console.log(typeof false);
        console.log(typeof "true");
        console.log(typeof undefined);
    </script>
</body>
</html>
